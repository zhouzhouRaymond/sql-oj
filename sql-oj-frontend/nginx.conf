# SQL OJ 前端 Nginx 配置：托管 Vite 构建产物 + 反向代理后端 API
# backend 为 docker-compose 中后端服务的名称
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # index.html 不缓存：前端发版后浏览器立即引用新的 hash 资源，避免看到旧页面
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
    }

    # 静态资源；未命中的路径回退到 index.html（支持 Vue Router history 模式）
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 后端 API 反向代理（保留 /api 前缀，与 Django 路由一致）
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Django Admin 反向代理
    location /admin/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Django 内置静态文件（DEBUG=True 时由 Django 直接提供）
    location /static/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }
}
